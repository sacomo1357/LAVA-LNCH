# Push a tag like v0.2.0 -> builds the Windows installers and publishes them as a GitHub release.
# The launcher's auto-updater reads that release, so the tag must match "version" in src-tauri/tauri.conf.json.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match tauri.conf.json version $v" }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LAVA LNCH ${{ github.ref_name }}'
          # One block per language; the site and the launcher show the block for the reader's language
          releaseBody: |
            <!-- ko -->
            Windows 설치 파일: `-setup.exe` (권장) 또는 `.msi`. 이미 설치했다면 런처가 시작할 때 자동으로 업데이트합니다.
            <!-- en -->
            Windows installers: `-setup.exe` (recommended) or `.msi`. If the launcher is already installed, it updates itself when it starts.
            <!-- cn -->
            Windows 安装文件：`-setup.exe`（推荐）或 `.msi`。如果已经安装，启动器会在启动时自动更新。
            <!-- jp -->
            Windows インストーラー: `-setup.exe`（推奨）または `.msi`。インストール済みの場合は、ランチャーの起動時に自動でアップデートされます。
          releaseDraft: false
          prerelease: false
