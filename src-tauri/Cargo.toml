[package]
name = "app"
version = "0.1.0"
description = "LAVA SE Minecraft Launcher"
authors = ["LAVA SE"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
tokio = { version = "1", features = ["rt", "fs", "process", "io-util", "time", "sync", "net", "macros"] }
getrandom = "0.3"
sha2 = "0.10"
futures-util = "0.3"
sha1 = "0.10"
hex = "0.4"
md5 = "0.7"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

